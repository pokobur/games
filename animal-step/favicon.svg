<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.3" flood-color="#1b5e20"/>
    </filter>
  </defs>

  <!-- Forest Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shogi Piece Tile -->
  <g filter="url(#shadow)">
    <!-- Piece Border -->
    <rect x="101" y="101" width="310" height="310" rx="46" fill="#d2b48c" stroke="#b08d57" stroke-width="4"/>
    <!-- Piece Cream Face -->
    <rect x="107" y="107" width="298" height="298" rx="40" fill="#fffdd0"/>
  </g>

  <!-- 8 Move Direction Dots (Red with white border) -->
  <g fill="#e53935" stroke="#ffffff" stroke-width="3">
    <!-- Top Row -->
    <circle cx="140" cy="140" r="13" />
    <circle cx="256" cy="140" r="13" />
    <circle cx="372" cy="140" r="13" />
    <!-- Middle Row -->
    <circle cx="140" cy="256" r="13" />
    <circle cx="372" cy="256" r="13" />
    <!-- Bottom Row -->
    <circle cx="140" cy="372" r="13" />
    <circle cx="256" cy="372" r="13" />
    <circle cx="372" cy="372" r="13" />
  </g>

  <!-- Lion Crown -->
  <g fill="#fbc02d" stroke="#f57f17" stroke-width="2">
    <path d="M 230,172 L 238,186 L 256,168 L 274,186 L 282,172 L 280,192 L 232,192 Z" />
    <circle cx="256" cy="182" r="4" fill="#e53935" stroke="none" />
  </g>

  <!-- Lion Mane (12 orange petal circles) -->
  <g fill="#f57c00">
    <!-- 12 Petals around 256, 260 -->
    <circle cx="256" cy="184" r="28" />
    <circle cx="294" cy="194" r="28" />
    <circle cx="324" cy="222" r="28" />
    <circle cx="332" cy="260" r="28" />
    <circle cx="324" cy="298" r="28" />
    <circle cx="294" cy="326" r="28" />
    <circle cx="256" cy="336" r="28" />
    <circle cx="218" cy="326" r="28" />
    <circle cx="188" cy="298" r="28" />
    <circle cx="180" cy="260" r="28" />
    <circle cx="188" cy="222" r="28" />
    <circle cx="218" cy="194" r="28" />
  </g>

  <!-- Lion Ears -->
  <circle cx="206" cy="214" r="18" fill="#f57c00" />
  <circle cx="206" cy="214" r="10" fill="#ffe082" />
  <circle cx="306" cy="214" r="18" fill="#f57c00" />
  <circle cx="306" cy="214" r="10" fill="#ffe082" />

  <!-- Lion Face Base -->
  <circle cx="256" cy="260" r="62" fill="#ffca28" />

  <!-- Cheeks Blush -->
  <ellipse cx="220" cy="274" rx="14" ry="10" fill="#ff8a80" opacity="0.7" />
  <ellipse cx="292" cy="274" rx="14" ry="10" fill="#ff8a80" opacity="0.7" />

  <!-- Muzzle -->
  <ellipse cx="256" cy="275" rx="26" ry="20" fill="#fff9c4" />

  <!-- Nose -->
  <polygon points="256,270 250,262 262,262" fill="#5d4037" />

  <!-- Mouth -->
  <path d="M 252,274 Q 250,282 245,282 M 260,274 Q 262,282 267,282" fill="none" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes -->
  <circle cx="232" cy="248" r="7" fill="#3e2723" />
  <circle cx="230" cy="246" r="2.5" fill="#ffffff" />
  <circle cx="280" cy="248" r="7" fill="#3e2723" />
  <circle cx="278" cy="246" r="2.5" fill="#ffffff" />
</svg>
