<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#def2ff" />
      <stop offset="60%" stop-color="#fff4dc" />
      <stop offset="100%" stop-color="#fff8e7" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2a568" />
      <stop offset="100%" stop-color="#b6743b" />
    </linearGradient>
  </defs>

  <!-- 背景 (角丸アプリアイコン) -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)" />
  
  <!-- 太陽とお空の飾り -->
  <circle cx="90" cy="90" r="45" fill="#ffeaa7" stroke="#5a3d2b" stroke-width="6" stroke-dasharray="14 8" />
  <circle cx="90" cy="90" r="32" fill="#ffd152" />
  <!-- 星 -->
  <path d="M 410 80 Q 410 95 395 95 Q 410 95 410 110 Q 410 95 425 95 Q 410 95 410 80 Z" fill="#ff9f43" />
  <path d="M 435 130 Q 435 140 425 140 Q 435 140 435 150 Q 435 140 445 140 Q 435 140 435 130 Z" fill="#ffd152" />

  <!-- 台座 -->
  <g filter="url(#crayon)">
    <rect x="76" y="405" width="360" height="34" rx="14" fill="url(#baseGrad)" stroke="#5a3d2b" stroke-width="9" />
    <!-- 柱 -->
    <rect x="186" y="439" width="140" height="50" fill="#a46733" stroke="#5a3d2b" stroke-width="8" />
    <!-- 草飾り -->
    <circle cx="120" cy="405" r="12" fill="#7ccb6a" stroke="#5a3d2b" stroke-width="4" />
    <circle cx="180" cy="405" r="10" fill="#7ccb6a" stroke="#5a3d2b" stroke-width="4" />
    <circle cx="330" cy="405" r="12" fill="#7ccb6a" stroke="#5a3d2b" stroke-width="4" />
    <circle cx="390" cy="405" r="10" fill="#7ccb6a" stroke="#5a3d2b" stroke-width="4" />
  </g>

  <!-- 1段目: パンダ (土台) -->
  <g id="panda" filter="url(#crayon)">
    <!-- 耳 -->
    <ellipse cx="195" cy="255" rx="26" ry="24" fill="#383838" stroke="#5a3d2b" stroke-width="8" />
    <ellipse cx="317" cy="255" rx="26" ry="24" fill="#383838" stroke="#5a3d2b" stroke-width="8" />
    <!-- 体/顔 -->
    <rect x="180" y="260" width="152" height="135" rx="46" fill="#ffffff" stroke="#5a3d2b" stroke-width="9" />
    <!-- 目周りの黒ブチ -->
    <ellipse cx="222" cy="320" rx="20" ry="24" transform="rotate(-15 222 320)" fill="#383838" />
    <ellipse cx="290" cy="320" rx="20" ry="24" transform="rotate(15 290 320)" fill="#383838" />
    <!-- 目（キラキラ） -->
    <circle cx="224" cy="318" r="7" fill="#ffffff" />
    <circle cx="288" cy="318" r="7" fill="#ffffff" />
    <!-- 鼻と口 -->
    <ellipse cx="256" cy="342" rx="9" ry="6" fill="#383838" />
    <path d="M 248 350 Q 256 358 264 350" fill="none" stroke="#5a3d2b" stroke-width="5" stroke-linecap="round" />
    <!-- ほっぺ -->
    <ellipse cx="204" cy="346" rx="12" ry="7" fill="#ffb8b8" opacity="0.8" />
    <ellipse cx="308" cy="346" rx="12" ry="7" fill="#ffb8b8" opacity="0.8" />
    <!-- 手 -->
    <ellipse cx="178" cy="358" rx="16" ry="20" transform="rotate(20 178 358)" fill="#383838" stroke="#5a3d2b" stroke-width="7" />
    <ellipse cx="334" cy="358" rx="16" ry="20" transform="rotate(-20 334 358)" fill="#383838" stroke="#5a3d2b" stroke-width="7" />
  </g>

  <!-- 2段目: てっぺんのペンギン (バランス乗っかり) -->
  <g id="penguin" filter="url(#crayon)">
    <!-- 体 -->
    <ellipse cx="256" cy="180" rx="52" ry="66" fill="#4a6572" stroke="#5a3d2b" stroke-width="8" />
    <!-- おなか（白） -->
    <ellipse cx="256" cy="192" rx="34" ry="46" fill="#ffffff" />
    <!-- 目 -->
    <circle cx="242" cy="162" r="5" fill="#383838" />
    <circle cx="270" cy="162" r="5" fill="#383838" />
    <!-- くちばし -->
    <polygon points="256,168 245,178 267,178" fill="#ffa726" stroke="#5a3d2b" stroke-width="4" stroke-linejoin="round" />
    <!-- ほっぺ -->
    <ellipse cx="232" cy="172" rx="7" ry="4" fill="#ffb8b8" opacity="0.8" />
    <ellipse cx="280" cy="172" rx="7" ry="4" fill="#ffb8b8" opacity="0.8" />
    <!-- 手（羽パタパタ） -->
    <ellipse cx="202" cy="188" rx="10" ry="24" transform="rotate(-30 202 188)" fill="#344955" stroke="#5a3d2b" stroke-width="6" />
    <ellipse cx="310" cy="188" rx="10" ry="24" transform="rotate(30 310 188)" fill="#344955" stroke="#5a3d2b" stroke-width="6" />
    <!-- 足 -->
    <ellipse cx="240" cy="244" rx="14" ry="7" fill="#ffa726" stroke="#5a3d2b" stroke-width="4" />
    <ellipse cx="272" cy="244" rx="14" ry="7" fill="#ffa726" stroke="#5a3d2b" stroke-width="4" />
    <!-- 王冠 (てっぺんのしるし) -->
    <path d="M 238 122 L 244 134 L 256 120 L 268 134 L 274 122 L 274 138 L 238 138 Z" fill="#ffd152" stroke="#5a3d2b" stroke-width="5" stroke-linejoin="round" />
  </g>
</svg>
