<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>らくがき3Dしょうかん ✨ 魔法の3Dお絵かき</title>
  <!-- Google Font Rounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- 背景のふわふわデコレーション（プニプニした星と泡） -->
  <div class="bubble-bg">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- ==================== HOME SCREEN ==================== -->
  <section id="screen-home" class="app-screen active">
    <!-- 装飾用のふわふわ浮遊パーツ -->
    <div class="deco-item deco-cloud-1">☁️</div>
    <div class="deco-item deco-cloud-2">☁️</div>
    <div class="deco-item deco-star-1">⭐</div>
    <div class="deco-item deco-star-2">🎈</div>
    <div class="deco-item deco-paint">🎨</div>

    <div class="logo-container">
      <div class="sparkle-effect">✨</div>
      <h1 class="main-title">
        らくがき3D<br><span class="title-summon">召喚!</span>
      </h1>
      <p class="subtitle">〜キミのえが3Dになってうごきだす！〜</p>
    </div>
    
    <div class="home-buttons">
      <button id="btn-start-drawing" class="btn-giant btn-primary">
        <span class="btn-icon">🎨</span>
        <span>おえかきをはじめる</span>
      </button>
      <button id="btn-goto-gallery" class="btn-giant btn-secondary">
        <span class="btn-icon">🎁</span>
        <span>おもちゃ箱をみる</span>
      </button>
    </div>
  </section>

  <!-- ==================== CANVAS SCREEN ==================== -->
  <section id="screen-canvas" class="app-screen">
    <!-- 装飾用 -->
    <div class="deco-item deco-canvas-crayon">✏️</div>
    <div class="deco-item deco-canvas-star">🌟</div>

    <div class="screen-header">
      <button class="btn-back btn-small">🏠 もどる</button>
      <h2 class="screen-title-badge">🎨 えをかこう</h2>
    </div>

    <!-- お絵かきエリア（おえかきタブレット風） -->
    <div class="canvas-outer-frame">
      <div class="canvas-container">
        <canvas id="paint-canvas"></canvas>
      </div>
      <div class="canvas-frame-badge">らくがきシート</div>
    </div>

    <!-- ツールバー -->
    <div class="canvas-toolbar">
      <div class="tool-group">
        <button id="tool-pen" class="tool-btn active" data-tool="pen">
          <span class="tool-icon">✏️</span>
          <span>ペン</span>
        </button>
        <button id="tool-eraser" class="tool-btn" data-tool="eraser">
          <span class="tool-icon">🧽</span>
          <span>けしごむ</span>
        </button>
        <button id="tool-bucket" class="tool-btn" data-tool="bucket">
          <span class="tool-icon">🪣</span>
          <span>ぬりつぶし</span>
        </button>
      </div>

      <div class="brush-size-group">
        <span class="brush-size-label">太さ:</span>
        <input type="range" id="brush-size" min="4" max="40" value="12">
      </div>

      <div class="utility-group">
        <button id="btn-undo" class="tool-btn btn-util" title="もどす">
          <span class="tool-icon">↩️</span>
          <span>もどす</span>
        </button>
        <button id="btn-redo" class="tool-btn btn-util" title="すすむ">
          <span class="tool-icon">↪️</span>
          <span>すすむ</span>
        </button>
        <label for="camera-import" class="tool-btn btn-util">
          <span class="tool-icon">📸</span>
          <span>カメラ</span>
          <input type="file" id="camera-import" accept="image/*" style="display:none">
        </label>
        <button id="btn-clear-canvas" class="tool-btn btn-danger">
          <span class="tool-icon">🧹</span>
          <span>けす</span>
        </button>
      </div>
    </div>

    <!-- カラーパレット -->
    <div class="palette-container">
      <div class="color-swatch active" style="background-color: #ff3b30;" data-color="#ff3b30"></div>
      <div class="color-swatch" style="background-color: #ff9500;" data-color="#ff9500"></div>
      <div class="color-swatch" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
      <div class="color-swatch" style="background-color: #4cd964;" data-color="#4cd964"></div>
      <div class="color-swatch" style="background-color: #5ac8fa;" data-color="#5ac8fa"></div>
      <div class="color-swatch" style="background-color: #007aff;" data-color="#007aff"></div>
      <div class="color-swatch" style="background-color: #5856d6;" data-color="#5856d6"></div>
      <div class="color-swatch" style="background-color: #ff2d55;" data-color="#ff2d55"></div>
      <div class="color-swatch" style="background-color: #ff9ccb;" data-color="#ff9ccb"></div>
      <div class="color-swatch" style="background-color: #8b5a2b;" data-color="#8b5a2b"></div>
      <div class="color-swatch" style="background-color: #555555;" data-color="#555555"></div>
      <div class="color-swatch" style="background-color: #000000;" data-color="#000000"></div>
      <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
      <div class="color-swatch" style="background-color: #16a085;" data-color="#16a085"></div>
      <div class="color-swatch" style="background-color: #d35400;" data-color="#d35400"></div>
      <div class="color-swatch" style="background-color: #2c3e50;" data-color="#2c3e50"></div>
    </div>

    <div class="action-footer">
      <button id="btn-generate-3d" class="btn-giant btn-sparkle">
        ✨ 3Dのまほうをかける！
      </button>
    </div>
  </section>

  <!-- ==================== MAGIC SCREEN (TRANSITION) ==================== -->
  <section id="screen-magic" class="app-screen">
    <div class="magic-wrapper">
      <div class="magic-circle-decor"></div>
      <div class="magic-circle">🔮</div>
      <div class="sparkles-container"></div>
      <h2 class="magic-status">まほうをかけているよ...</h2>
      <p class="magic-hint">えが３Dの「おもちゃ」になっているよ！</p>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </section>

  <!-- ==================== 3D PREVIEW SCREEN ==================== -->
  <section id="screen-preview" class="app-screen">
    <!-- 装飾用 -->
    <div class="deco-item deco-prev-toy">🧸</div>
    <div class="deco-item deco-prev-star">💫</div>

    <div class="screen-header">
      <button id="btn-back-to-canvas" class="btn-back btn-small">🎨 かきなおす</button>
      <h2 class="screen-title-badge">👀 できた！</h2>
    </div>

    <!-- 3D表示ビューア (ショーケース風) -->
    <div class="viewer-3d-outer">
      <div id="preview-3d-container" class="viewer-3d-container"></div>
      <div class="viewer-badge">3Dおもちゃ</div>
    </div>

    <!-- キャラクター情報設定 -->
    <div class="character-setup-box">
      <div class="input-row">
        <label for="char-name-input" class="name-label">おなまえ:</label>
        <div class="input-wrapper">
          <input type="text" id="char-name-input" placeholder="なまえをつけてね" maxlength="15">
          <button id="btn-speech-name" class="btn-speech" title="こえでいれる">🎤</button>
        </div>
      </div>
    </div>

    <div class="action-footer">
      <button id="btn-save-to-gallery" class="btn-giant btn-primary">
        🎁 おもちゃ箱にいれる！
      </button>
    </div>
  </section>

  <!-- ==================== GALLERY SCREEN ==================== -->
  <section id="screen-gallery" class="app-screen">
    <!-- 装飾用 -->
    <div class="deco-item deco-gal-box">📦</div>
    <div class="deco-item deco-gal-star">✨</div>

    <div class="screen-header">
      <button class="btn-back btn-small">🏠 もどる</button>
      <h2 class="screen-title-badge">🎁 マイおもちゃ箱</h2>
    </div>

    <!-- おもちゃ箱グリッド -->
    <div id="gallery-grid" class="gallery-grid-container">
      <div class="empty-gallery-msg">
        まだおもちゃがないよ。<br>
        えをかいて、3Dにしてみてね！🎨
      </div>
    </div>
  </section>

  <!-- ==================== AR SUMMON SCREEN ==================== -->
  <section id="screen-ar" class="app-screen">
    <!-- カメラ映像を背景にするため、ここに映像を重ねる -->
    <video id="ar-video" autoplay playsinline muted></video>
    <div id="ar-3d-container" class="ar-canvas-container"></div>

    <!-- UIオーバーレイ -->
    <div class="ar-ui-overlay">
      <div class="ar-header">
        <button id="btn-exit-ar" class="btn-back btn-small">🎁 おもちゃ箱</button>
        <div class="ar-title-badge"><span id="ar-char-name">キャラクター</span></div>
      </div>

      <!-- カメラ警告アラート（上部） -->
      <div class="ar-warning-alert">
        ⚠️ まわりのひとや、ものに気をつけてあそんでね！
      </div>

      <!-- 照準（床認識インジケーター） -->
      <div id="ar-reticle" class="ar-reticle-indicator">
        <div class="reticle-circle"></div>
        <div class="reticle-label">ここをタップして召喚</div>
      </div>

      <!-- 下部アニメーション/操作パネル (ゲームコントローラー風) -->
      <div class="ar-control-panel">
        <div class="animation-buttons-label">🎮 うごかしてみよう！</div>
        <div class="ar-actions-row">
          <button class="btn-action-trigger btn-action" data-action="walk">
            <span class="act-icon">🚶‍♂️</span>
            <span>あるく</span>
          </button>
          <button class="btn-action-trigger btn-action" data-action="jump">
            <span class="act-icon">🦘</span>
            <span>ジャンプ</span>
          </button>
          <button class="btn-action-trigger btn-action" data-action="dance">
            <span class="act-icon">💃</span>
            <span>おどる</span>
          </button>
          <button class="btn-action-trigger btn-action" data-action="idle">
            <span class="act-icon">🧍‍♂️</span>
            <span>とまる</span>
          </button>
        </div>

        <div class="ar-utility-row">
          <button id="btn-capture-photo" class="btn-capture">
            <span>📸</span>
            <span>写真をとる</span>
          </button>
          <button id="btn-share-link" class="btn-share">
            <span>🔗</span>
            <span>みんなに送る</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== SHARE LINK MODAL ==================== -->
  <div id="modal-share-result" class="app-modal">
    <div class="modal-content">
      <div class="modal-star-icon">✨</div>
      <h3>まほうの共有リンク</h3>
      <p class="modal-desc">
        おともだちや家族に送ると、キミの3Dおもちゃをよびだせるよ！
      </p>

      <div class="share-link-box">
        <input type="text" id="share-url-text" readonly>
        <button id="btn-copy-link" class="btn-modal btn-primary">コピー</button>
      </div>

      <div id="share-qr-container" class="qr-container">
        <!-- QRコードが生成される -->
      </div>
      
      <div class="modal-buttons">
        <button id="btn-close-share" class="btn-modal btn-secondary">とじる</button>
      </div>
    </div>
  </div>

  <!-- エントリーポイントJS -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
