<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#14111f">
  <meta name="description" content="自作TCGカードメーカー - スマホで写真やイラストからオリジナルのトレーディングカードを作成・図鑑管理・デッキ構築・印刷用PDF出力ができるWebアプリ">
  <title>自作TCGカードメーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1><span class="logo">◆</span> 自作TCGカードメーカー</h1>
    </header>

    <main class="app-main">
      <!-- ============ カード作成タブ ============ -->
      <section id="tab-create" class="tab-panel active" aria-label="カード作成">
        <div class="create-layout">
          <!-- 上部：固定プレビュー -->
          <div class="preview-pane" id="previewPane">
            <div class="preview-wrap">
              <canvas id="preview" width="756" height="1056" aria-label="カードプレビュー"></canvas>
            </div>
            <div class="preview-bar">
              <span class="edit-status" id="editStatus">新規カード</span>
              <span class="preview-hint">ドラッグで移動／ピンチ・ホイールで拡大</span>
              <button type="button" class="icon-btn" id="togglePreviewSize" title="プレビューの大きさを切替" aria-label="プレビューの大きさを切替">⤢</button>
            </div>
          </div>

          <!-- 下部：スクロールフォーム -->
          <div class="form-pane">
            <form id="cardForm" autocomplete="off" onsubmit="return false">
              <fieldset class="panel">
                <legend>イラスト・写真</legend>
                <div class="btn-row">
                  <label class="btn primary file-btn">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    📷 画像を選択
                  </label>
                  <button type="button" class="btn" id="resetTransform">位置リセット</button>
                  <button type="button" class="btn danger-ghost" id="removeImage">画像を外す</button>
                </div>
                <div class="slider-group" id="transformControls">
                  <label class="slider">
                    <span>横位置</span>
                    <input type="range" id="tx" min="-800" max="800" step="1" value="0">
                    <output id="txOut">0</output>
                  </label>
                  <label class="slider">
                    <span>縦位置</span>
                    <input type="range" id="ty" min="-800" max="800" step="1" value="0">
                    <output id="tyOut">0</output>
                  </label>
                  <label class="slider">
                    <span>拡大</span>
                    <input type="range" id="tscale" min="0.5" max="2.5" step="0.01" value="1">
                    <output id="tscaleOut">1.00x</output>
                  </label>
                </div>
              </fieldset>

              <fieldset class="panel">
                <legend>基本情報</legend>
                <label class="field">
                  <span class="field-label">カード名 <small class="counter" data-for="name">0/12</small></span>
                  <input type="text" id="name" maxlength="12" placeholder="例：紅蓮の竜騎士" enterkeyhint="next">
                </label>

                <div class="field">
                  <span class="field-label">属性</span>
                  <div class="attr-picker" id="attrPicker" role="radiogroup" aria-label="属性"></div>
                </div>

                <label class="field">
                  <span class="field-label">レベル <small id="levelOut" class="level-out">★4</small></span>
                  <input type="range" id="level" min="1" max="10" step="1" value="4">
                </label>

                <label class="field">
                  <span class="field-label">種族・タイプ <small class="counter" data-for="subType">0/8</small></span>
                  <input type="text" id="subType" maxlength="8" placeholder="例：ドラゴン族" enterkeyhint="next">
                </label>
              </fieldset>

              <fieldset class="panel">
                <legend>効果・テキスト</legend>
                <label class="field">
                  <span class="field-label">効果テキスト <small class="counter" data-for="effectText">0/80</small></span>
                  <textarea id="effectText" maxlength="80" rows="5" placeholder="1行約16文字で自動折り返し（最大5行）。改行も使えます。"></textarea>
                </label>
              </fieldset>

              <fieldset class="panel">
                <legend>ステータス</legend>
                <div class="stat-row">
                  <label class="field">
                    <span class="field-label">ATK（攻撃力）</span>
                    <input type="text" id="atk" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="1000">
                  </label>
                  <label class="field">
                    <span class="field-label">HP（体力）</span>
                    <input type="text" id="hp" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="1000">
                  </label>
                </div>
              </fieldset>

              <div class="action-bar">
                <button type="button" class="btn" id="newCard">＋ 新規</button>
                <button type="button" class="btn" id="downloadPng">PNG保存</button>
                <button type="button" class="btn" id="saveCopy" hidden>複製保存</button>
                <button type="button" class="btn primary" id="saveCard">💾 図鑑に保存</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- ============ コレクション（図鑑）タブ ============ -->
      <section id="tab-collection" class="tab-panel" aria-label="コレクション" hidden>
        <div class="page">
          <div class="page-head">
            <h2>コレクション <small id="collectionCount">0枚</small></h2>
            <div class="btn-row compact">
              <button type="button" class="btn small" id="exportBackup">バックアップ</button>
              <label class="btn small file-btn">
                <input type="file" id="importBackup" accept="application/json,.json" hidden>
                復元
              </label>
            </div>
          </div>
          <div class="toolbar">
            <input type="search" id="collectionSearch" placeholder="カード名・種族で検索">
            <select id="collectionSort" aria-label="並び替え">
              <option value="updated">更新順</option>
              <option value="created">作成順</option>
              <option value="name">名前順</option>
              <option value="level">レベル順</option>
              <option value="atk">ATK順</option>
              <option value="hp">HP順</option>
            </select>
          </div>
          <div class="chip-row" id="collectionFilter"></div>
          <div class="card-grid" id="collectionGrid"></div>
          <div class="empty" id="collectionEmpty" hidden>
            <p>まだカードがありません。</p>
            <button type="button" class="btn primary" data-goto="create">カードを作る</button>
          </div>
        </div>
      </section>

      <!-- ============ デッキ構築・印刷タブ ============ -->
      <section id="tab-deck" class="tab-panel" aria-label="デッキ構築・印刷" hidden>
        <div class="page deck-page">
          <div class="page-head">
            <h2>デッキ構築・印刷</h2>
          </div>
          <div class="deck-select-row">
            <select id="deckSelect" aria-label="デッキを選択"></select>
            <button type="button" class="btn small" id="newDeck">新規</button>
            <button type="button" class="btn small" id="renameDeck">名前変更</button>
            <button type="button" class="btn small danger-ghost" id="deleteDeck">削除</button>
          </div>

          <div class="deck-columns">
            <div class="panel deck-panel">
              <div class="deck-summary">
                <div class="deck-total"><strong id="deckTotal">0</strong> / <span id="deckMax">40</span> 枚</div>
                <div class="progress"><div class="progress-bar" id="deckProgress"></div></div>
                <div class="attr-breakdown" id="deckBreakdown"></div>
              </div>
              <ul class="deck-list" id="deckList"></ul>
              <p class="empty small" id="deckEmpty">右（下）のカード一覧からタップして追加してください。</p>
              <button type="button" class="btn small danger-ghost" id="clearDeck">デッキを空にする</button>
            </div>

            <div class="panel pool-panel">
              <h3>カードを追加 <small>タップで +1</small></h3>
              <input type="search" id="poolSearch" placeholder="カード名で絞り込み">
              <div class="pool-grid" id="poolGrid"></div>
              <p class="empty small" id="poolEmpty" hidden>コレクションにカードがありません。</p>
            </div>
          </div>

          <div class="panel print-panel">
            <h3>🖨 印刷用PDF（A4・300dpi相当）</h3>
            <p class="note">63×88mm のカードを A4 1ページに 3×3 枚配置します。印刷時は「実際のサイズ（100%）」を選択してください。</p>
            <div class="print-options">
              <label class="check"><input type="checkbox" id="optCropMarks" checked> トンボ（裁断線）</label>
              <label class="check"><input type="checkbox" id="optBacks"> 裏面ページを追加（両面印刷・長辺とじ）</label>
              <label class="inline-field">カード間隔
                <select id="optGap">
                  <option value="0">0mm</option>
                  <option value="1">1mm</option>
                  <option value="2" selected>2mm</option>
                  <option value="3">3mm</option>
                </select>
              </label>
            </div>
            <button type="button" class="btn primary wide" id="exportPdf">PDFを出力</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" role="tablist">
      <button type="button" class="tab active" data-tab="create" role="tab"><span class="tab-icon">✎</span>カード作成</button>
      <button type="button" class="tab" data-tab="collection" role="tab"><span class="tab-icon">▦</span>コレクション</button>
      <button type="button" class="tab" data-tab="deck" role="tab"><span class="tab-icon">❖</span>デッキ・印刷</button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <button type="button" class="modal-close" data-close-modal aria-label="閉じる">×</button>
      <div class="modal-body"></div>
    </div>
  </div>

  <div id="busy" class="busy" hidden>
    <div class="spinner"></div>
    <div class="busy-text">処理中…</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
